<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Portal — Campus Complaint Tracker</title>
    <link rel="stylesheet" href="/css/main.css">
    <style>
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            position: relative;
        }

        .auth-card {
            width: 100%;
            max-width: 480px;
            padding: 2.5rem;
            border-radius: var(--radius-lg);
            position: relative;
            z-index: 2;
        }

        .auth-tabs {
            display: flex;
            gap: 0.5rem;
            background: rgba(13, 21, 39, 0.6);
            padding: 0.35rem;
            border-radius: var(--radius-sm);
            margin-bottom: 2rem;
            border: 1px solid var(--border-subtle);
        }

        .auth-tab-btn {
            flex: 1;
            padding: 0.65rem 0.5rem;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.9rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all var(--transition-fast);
            text-align: center;
        }

        .auth-tab-btn.active {
            background: var(--bg-surface-hover);
            color: var(--text-primary);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-active);
        }

        .demo-credentials-box {
            margin-top: 1.75rem;
            padding: 1.1rem;
            background: rgba(13, 21, 39, 0.7);
            border: 1px dashed var(--border-active);
            border-radius: var(--radius-sm);
        }

        .demo-btn-group {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.6rem;
            flex-wrap: wrap;
        }

        .demo-chip {
            padding: 0.35rem 0.65rem;
            background: rgba(91, 140, 255, 0.12);
            border: 1px solid rgba(91, 140, 255, 0.3);
            border-radius: var(--radius-sm);
            color: var(--accent-cyan);
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .demo-chip:hover {
            background: rgba(91, 140, 255, 0.25);
            border-color: var(--accent-cyan);
        }

        .pw-wrapper {
            position: relative;
        }

        .pw-toggle {
            position: absolute;
            right: 0.9rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.25rem;
            display: flex;
            align-items: center;
        }

        .pw-toggle:hover {
            color: var(--text-primary);
        }
    </style>
</head>
<body>

    <div class="auth-wrapper">
        <div class="glass-card auth-card">
            <div style="text-align:center; margin-bottom:2rem;">
                <a href="/" class="brand-logo" style="display:inline-flex; margin-bottom:0.75rem;">
                    <div class="brand-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
                    </div>
                    <span>CampusTracker<span style="color:var(--accent-cyan)">.</span></span>
                </a>
                <p style="font-size:0.92rem; color:var(--text-secondary);" id="auth-subtitle">Access your campus account</p>
            </div>

            <!-- Tab Navigation -->
            <div class="auth-tabs">
                <button type="button" class="auth-tab-btn active" id="tab-login" onclick="switchAuthTab('login')">Sign In</button>
                <button type="button" class="auth-tab-btn" id="tab-register" onclick="switchAuthTab('register')">Register</button>
                <button type="button" class="auth-tab-btn" id="tab-reset" onclick="switchAuthTab('reset')">Reset PW</button>
            </div>

            <!-- 1. LOGIN FORM -->
            <form id="form-login" onsubmit="handleLoginSubmit(event)">
                <div class="form-group">
                    <label class="form-label" for="login-email">College Email</label>
                    <input type="email" id="login-email" class="form-control" placeholder="name@campus.edu" required autocomplete="email">
                </div>

                <div class="form-group">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <label class="form-label" for="login-password">Password</label>
                        <a href="javascript:void(0)" onclick="switchAuthTab('reset')" style="font-size:0.8rem; color:var(--accent-cyan);">Forgot Password?</a>
                    </div>
                    <div class="pw-wrapper">
                        <input type="password" id="login-password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" class="pw-toggle" onclick="togglePasswordVisibility('login-password')" aria-label="Toggle password visibility">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width:100%; margin-top:0.75rem;" id="btn-submit-login">
                    Sign In to Portal
                </button>

                <!-- Quick-Fill Demo Credentials -->
                <div class="demo-credentials-box">
                    <div style="font-size:0.78rem; font-weight:700; color:var(--text-secondary); text-transform:uppercase; letter-spacing:0.05em;">
                        Faculty Evaluation Quick-Fill
                    </div>
                    <div class="demo-btn-group">
                        <button type="button" class="demo-chip" onclick="quickFillCredentials('admin@campus.edu', 'Admin@123')">
                            🛡️ Administrator
                        </button>
                        <button type="button" class="demo-chip" onclick="quickFillCredentials('student1@campus.edu', 'Student@123')">
                            🎓 Student 1 (Aarav)
                        </button>
                        <button type="button" class="demo-chip" onclick="quickFillCredentials('student2@campus.edu', 'Student@123')">
                            🎓 Student 2 (Priya)
                        </button>
                    </div>
                </div>
            </form>

            <!-- 2. REGISTER FORM -->
            <form id="form-register" style="display:none;" onsubmit="handleRegisterSubmit(event)">
                <div class="form-group">
                    <label class="form-label" for="reg-fullname">Full Name</label>
                    <input type="text" id="reg-fullname" class="form-control" placeholder="e.g. Aarav Sharma" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-email">College Email Address</label>
                    <input type="email" id="reg-email" class="form-control" placeholder="student@campus.edu" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-studentid">Student ID / Roll Number</label>
                    <input type="text" id="reg-studentid" class="form-control" placeholder="e.g. CS2025-042" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-department">Academic Department</label>
                    <select id="reg-department" class="form-select" required>
                        <option value="" disabled selected>Select Department</option>
                        <option value="Computer Science & Engineering">Computer Science & Engineering</option>
                        <option value="Electrical & Electronics Engineering">Electrical & Electronics Engineering</option>
                        <option value="Mechanical Engineering">Mechanical Engineering</option>
                        <option value="Civil Engineering">Civil Engineering</option>
                        <option value="Information Technology">Information Technology</option>
                        <option value="Physics & Science Complex">Physics & Science Complex</option>
                        <option value="School of Management">School of Management</option>
                        <option value="General Campus Facility">General Campus Facility</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-password">Create Password</label>
                    <div class="pw-wrapper">
                        <input type="password" id="reg-password" class="form-control" placeholder="Minimum 6 characters" minlength="6" required>
                        <button type="button" class="pw-toggle" onclick="togglePasswordVisibility('reg-password')" aria-label="Toggle password visibility">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-confirm">Confirm Password</label>
                    <div class="pw-wrapper">
                        <input type="password" id="reg-confirm" class="form-control" placeholder="Re-enter password" required>
                        <button type="button" class="pw-toggle" onclick="togglePasswordVisibility('reg-confirm')" aria-label="Toggle password visibility">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-accent" style="width:100%; margin-top:0.75rem;" id="btn-submit-register">
                    Create Student Account
                </button>
            </form>

            <!-- 3. DEV PASSWORD RESET FORM -->
            <form id="form-reset" style="display:none;" onsubmit="handleResetSubmit(event)">
                <div style="padding:0.9rem; background:rgba(56, 217, 255, 0.08); border-radius:var(--radius-sm); border:1px solid rgba(56, 217, 255, 0.2); margin-bottom:1.5rem; font-size:0.85rem; color:var(--text-secondary);">
                    <strong>Academic Demo Reset:</strong> Updates user password securely directly in SQLite without requiring external email SMTP delivery.
                </div>

                <div class="form-group">
                    <label class="form-label" for="reset-email">Registered Email</label>
                    <input type="email" id="reset-email" class="form-control" placeholder="user@campus.edu" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reset-password">New Password</label>
                    <div class="pw-wrapper">
                        <input type="password" id="reset-password" class="form-control" placeholder="Minimum 6 characters" minlength="6" required>
                        <button type="button" class="pw-toggle" onclick="togglePasswordVisibility('reset-password')" aria-label="Toggle password visibility">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width:100%; margin-top:0.75rem;" id="btn-submit-reset">
                    Update Password in SQLite
                </button>
            </form>

            <div style="margin-top:1.5rem; text-align:center;">
                <a href="/" style="font-size:0.88rem; color:var(--text-muted);">&larr; Back to Campus Homepage</a>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
